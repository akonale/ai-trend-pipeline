# Production stack. Settings come from the server's .env.prod (pass --env-file .env.prod from the repo root).
name: ai-trend-prod

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    - temporal

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_SEEDS: postgres

  temporal-ui:
    image: temporalio/ui:2.51.1
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:18233:8080"

  worker:
    <<: *app
    command: ["python", "-m", "ai_trend_pipeline.worker"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      CHART_OUTPUT_DIR: /data/charts
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BLUESKY_HANDLE: ${BLUESKY_HANDLE}
      BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD}
    volumes:
      - charts:/data/charts

  web:
    <<: *app
    command: ["python", "-m", "ai_trend_pipeline.web"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      CHART_OUTPUT_DIR: /data/charts
      WEB_HOST: 0.0.0.0
      AUTH_MODE: cloudflare
      TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-http://localhost:18233}
    volumes:
      - charts:/data/charts
    ports:
      - "127.0.0.1:18000:8000"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      - web
      - temporal-ui
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.prod}

volumes:
  postgres-data:
  charts:
