[project]
name = "ai-trend-pipeline"
version = "0.1.0"
description = "AI trend pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "temporalio",
    "uvicorn>=0.54.0",
    "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trend_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
