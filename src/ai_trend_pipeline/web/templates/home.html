{% extends "base.html" %}
{% block title %}Topic Studio{% endblock %}
{% block content %}
<h1>What should today's chart be about?</h1>
{% if view.error %}<p class="error" role="alert">{{ view.error }}</p>{% endif %}
<section class="card">
  <form class="topic-form" method="post" action="/runs">
    <label for="topic">Topic</label>
    <div class="topic-row">
      <input type="text" id="topic" name="topic" required maxlength="200" value="{{ view.topic }}" placeholder="e.g. Life expectancy">
      <button type="submit" class="btn btn--primary">Generate</button>
    </div>
    <ul class="chips" aria-label="Example topics">
      {% for chip in view.examples %}<li><a class="chip" href="{{ chip.href }}">{{ chip.label }}</a></li>
      {% endfor %}
    </ul>
  </form>
</section>
{% endblock %}
